name: Publish signed desktop release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify-version:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Verify release tag and application version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          test "${GITHUB_REF_NAME}" = "v${version}"

  prepare-release:
    needs: verify-version
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - uses: actions/checkout@v7
      - name: Create or locate the release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          release_id="$(
            gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
              --jq ".[] | select(.tag_name == \"${tag}\") | .id" | sort -n | head -1
          )"

          if [[ -z "$release_id" ]]; then
            gh release create "$tag" \
              --target "$GITHUB_SHA" \
              --title "Writing Environment ${tag}" \
              --notes-file .github/release-notes.md
            release_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" --jq .id)"
          fi

          echo "release_id=${release_id}" >>"$GITHUB_OUTPUT"

  publish:
    needs:
      - verify-version
      - prepare-release
    strategy:
      fail-fast: false
      # Each job merges its platform into latest.json. Serial uploads prevent
      # concurrent jobs from replacing that file with stale platform data.
      max-parallel: 1
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin --bundles app
            rust_targets: aarch64-apple-darwin
            linux: false
            raspberry_pi: false
            apple_identity: "-"
            macos: true
          - platform: ubuntu-22.04
            args: --bundles deb
            rust_targets: ""
            linux: true
            raspberry_pi: false
            apple_identity: ""
            macos: false
          - platform: ubuntu-22.04-arm
            args: --bundles deb
            rust_targets: ""
            linux: true
            raspberry_pi: true
            apple_identity: ""
            macos: false
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux build dependencies
        if: matrix.linux
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf xdg-utils file
      - uses: pnpm/action-setup@v6
        with:
          version: 10.17.1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          APPLE_SIGNING_IDENTITY: ${{ matrix.apple_identity }}
        with:
          releaseId: ${{ needs.prepare-release.outputs.release_id }}
          releaseBody: |
            Fixes the Raspberry Pi appliance's Display and Control Centre behavior. Display now opens a dedicated screen-layout window instead of calling a standalone command that Raspberry Pi OS does not ship.

            The writer remains visually fullscreen, but now uses a borderless maximized Linux window so Control Centre dialogs and other system utilities can appear above it. This prevents settings actions from seeming to freeze when a dialog opens. System-drawer launches are also recorded in ~/.cache/writing-environment/launcher.log for diagnostics.

            The signed APT repository continues to update the application and appliance shell together with Raspberry Pi OS through the Super+Space Updates action. Fresh flashable images include this fix.

            Signed desktop release for macOS Apple Silicon, Linux amd64, and Raspberry Pi ARM64.

            This is a personal project under active development. Back up important writing and review the release notes before updating.
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          args: ${{ matrix.args }}
      - name: Package the macOS manual bootstrap app
        if: matrix.macos
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(node -p "require('./package.json').version")"
          app="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Writing Environment.app"
          archive="Writing-Environment-macOS-${version}.zip"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$archive"
          shasum -a 256 "$archive" >"$archive.sha256"
          gh release upload "v${version}" "$archive" "$archive.sha256" --clobber
      - name: Package the Raspberry Pi manual bootstrap kit
        if: matrix.raspberry_pi
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          version="$(node -p "require('./package.json').version")"
          output="artifacts/pi-arm64/github-${GITHUB_RUN_NUMBER}"
          scripts/pi/package-artifact.sh "$output" "github-${GITHUB_RUN_NUMBER}"
          archive="$(find "$output" -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          pnpm tauri signer sign "$archive"
          gh release upload "v${version}" "$archive" "$archive.sha256" "$archive.sig" --clobber

  apt-repository:
    needs:
      - verify-version
      - prepare-release
      - publish
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Install Debian repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-utils dpkg-dev file gnupg gpgv libgtk-3-dev pkg-config
      - name: Download the released Raspberry Pi application package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p artifacts/apt-input
          gh release download "${GITHUB_REF_NAME}" \
            --pattern 'Writing.Environment_*_arm64.deb' \
            --dir artifacts/apt-input
      - name: Build Raspberry Pi Control Centre integration
        run: |
          mkdir -p artifacts/apt-plugin
          cc -shared -fPIC \
            $(pkg-config --cflags gtk+-3.0) \
            deploy/pi-image/settings-plugin/bluetooth.c \
            $(pkg-config --libs gtk+-3.0) \
            -o artifacts/apt-plugin/librpcc_writing-environment-bluetooth.so
          cc -std=c11 -O2 -Wall -Wextra -Werror \
            $(pkg-config --cflags gtk+-3.0) \
            deploy/pi-image/settings-plugin/display-settings.c \
            $(pkg-config --libs gtk+-3.0) -ldl \
            -o artifacts/apt-plugin/writing-environment-display-settings
          file artifacts/apt-plugin/librpcc_writing-environment-bluetooth.so \
            | grep -qE 'ELF 64-bit.*(ARM aarch64|aarch64)'
          file artifacts/apt-plugin/writing-environment-display-settings \
            | grep -qE 'ELF 64-bit.*(ARM aarch64|aarch64)'
      - name: Build appliance packages
        run: |
          app_deb="$(find artifacts/apt-input -maxdepth 1 -type f -name '*.deb' -print -quit)"
          scripts/apt/build-packages.sh \
            --app-deb "$app_deb" \
            --settings-plugin artifacts/apt-plugin/librpcc_writing-environment-bluetooth.so \
            --display-settings artifacts/apt-plugin/writing-environment-display-settings \
            --public-key deploy/apt-repository/writing-environment-archive-keyring.asc \
            --output artifacts/apt-packages
      - name: Build and sign APT repository
        env:
          APT_SIGNING_PRIVATE_KEY: ${{ secrets.APT_SIGNING_PRIVATE_KEY }}
        run: |
          signing_key="$RUNNER_TEMP/writing-environment-apt-private.asc"
          printf '%s' "$APT_SIGNING_PRIVATE_KEY" >"$signing_key"
          chmod 0600 "$signing_key"
          scripts/apt/build-repository.sh \
            --packages artifacts/apt-packages \
            --private-key "$signing_key" \
            --output artifacts/apt-repository
      - name: Upload appliance packages to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            artifacts/apt-packages/writing-environment-appliance_*.deb \
            artifacts/apt-packages/writing-environment-boot-theme_*.deb \
            artifacts/apt-packages/writing-environment-repository_*.deb \
            artifacts/apt-packages/writing-environment-shell_*.deb \
            deploy/apt-repository/writing-environment-archive-keyring.asc \
            --clobber
      - name: Upload APT repository Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: artifacts/apt-repository/site

  deploy-apt-repository:
    needs: apt-repository
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish signed APT repository
        id: deployment
        uses: actions/deploy-pages@v4
