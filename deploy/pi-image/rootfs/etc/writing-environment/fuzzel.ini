[main]
font=Nunito Sans:size=13
prompt="System: "
placeholder=Type to filter
icon-theme=PiXtrix
icons-enabled=yes
fields=filename,name,generic,categories,keywords,comment
terminal=x-terminal-emulator -e
anchor=center
lines=12
width=54
horizontal-pad=28
vertical-pad=18
inner-pad=10
line-height=28
layer=overlay
keyboard-focus=exclusive
exit-on-keyboard-focus-loss=yes
match-mode=fzf
sort-result=no
match-counter=no
render-workers=1
match-workers=1

[colors]
background=202224f5
text=e8e5ddff
prompt=8eabb5ff
placeholder=8f928fff
input=f4f1eaff
match=91b8c5ff
selection=426a78ff
selection-text=ffffffff
selection-match=ffffffff
border=5f7f89ff

[border]
width=2
radius=14

[dmenu]
mode=index
exit-immediately-if-empty=yes
